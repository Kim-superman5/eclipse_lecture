<title>식 현상 학습</title>

<style>
    body{
        margin:0;
        font-family:'Malgun Gothic', sans-serif;

        background:

        radial-gradient(circle at 80% 40%, rgba(255,255,255,0.1) 1px, transparent 2px),

    }

        display:block;

        width:100%;

        padding:18px;

        border:none;
        border-radius:12px;

        cursor:pointer;

        background:#1f2833;
        color:white;

        transition:0.25s;
    }

    .menu-btn:hover{
        background:#66fcf1;
        color:black;
        transform:scale(1.03);
    }

    a{
        text-decoration:none;
    }

    .footer{
